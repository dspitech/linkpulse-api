global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - 'alerts.yml'
scrape_configs:
  - job_name: 'linkpulse-api'
    static_configs:
      - targets:
          - 'linkpulse-staging:8000'   # nom DNS Docker (reseau cicd-network)
    metrics_path: /metrics
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

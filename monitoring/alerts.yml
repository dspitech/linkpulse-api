groups:
  - name: linkpulse
    rules:
      - alert: HighRedirectLatency
        expr: |
          histogram_quantile(0.99,
            rate(redirect_duration_seconds_bucket[5m])
          ) > 0.3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Latence p99 elevee sur les redirections LinkPulse'
      - alert: HighNotFoundRate
        expr: |
          rate(redirects_total{status="not_found"}[5m])
          / rate(redirects_total[5m]) * 100 > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Taux de liens introuvables superieur a 10% sur 5 minutes"
      - alert: LinkPulseDown
        expr: up{job="linkpulse-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LinkPulse API ne repond plus au scrape Prometheus"
